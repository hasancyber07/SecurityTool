<!DOCTYPE html>
<html>
<head>
<title>Security Dashboard PRO</title>

<style>
body {
    margin:0;
    font-family: monospace;
    background:#050505;
    color:#00ff99;
    display:flex;
}

/* SIDEBAR */
.sidebar {
    width:220px;
    height:100vh;
    background:#0b0b0b;
    padding:20px;
    border-right:1px solid #00ff99;
}

.sidebar h2 {
    color:#00ff99;
    margin-bottom:20px;
}

.menu {
    margin-top:20px;
}

.menu div {
    padding:10px;
    margin:10px 0;
    border:1px solid #00ff99;
    cursor:pointer;
}

.menu div:hover {
    background:#00ff99;
    color:black;
}

/* MAIN */
.main {
    flex:1;
    padding:20px;
}

/* CARDS */
.cards {
    display:flex;
    gap:20px;
}

.card {
    flex:1;
    padding:20px;
    border:1px solid #00ff99;
    background:rgba(0,255,153,0.05);
    border-radius:10px;
}

/* LOG BOX */
.logbox {
    margin-top:20px;
    padding:20px;
    border:1px solid #00ff99;
    height:300px;
    overflow:auto;
    background:#0a0a0a;
}

/* BUTTON */
button {
    margin-top:10px;
    padding:10px;
    background:black;
    color:#00ff99;
    border:1px solid #00ff99;
    cursor:pointer;
}

button:hover {
    background:#00ff99;
    color:black;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>SECURITY PANEL</h2>

    <div class="menu">
        <div>Dashboard</div>
        <div>Logs</div>
        <div>Scanner</div>
        <div>Settings</div>
    </div>
</div>

<!-- MAIN -->
<div class="main">

    <h1>?? SECURITY DASHBOARD PRO</h1>

    <div class="cards">
        <div class="card">
            STATUS<br>
            <b>ONLINE ?</b>
        </div>

        <div class="card">
            TOTAL LOGS<br>
            <b id="count">0</b>
        </div>

        <div class="card">
            LAST UPDATE<br>
            <b id="time">-</b>
        </div>
    </div>

    <div class="logbox">
        <pre id="log">Loading...</pre>
    </div>

    <button onclick="loadLog()">REFRESH</button>

</div>

<script>
let lastData = "";

function loadLog() {
    fetch("https://securitytool-6tc6.onrender.com/logs")
    .then(res => res.text())
    .then(data => {

        document.getElementById("log").innerText = data;

        let lines = data.trim().split("\n");
        document.getElementById("count").innerText = lines.length;

        document.getElementById("time").innerText =
            new Date().toLocaleTimeString();
    })
    .catch(err => {
        document.getElementById("log").innerText = "Error loading logs...";
    });
}

setInterval(loadLog, 2000);
loadLog();
</script>

</body>
</html>
