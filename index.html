<!DOCTYPE html>
<html>
<head>
<title>Security Dashboard PRO</title>

<style>
body {
    background:#0a0a0a;
    color:#00ff00;
    font-family: monospace;
    text-align:center;
}

.box {
    border:1px solid #00ff00;
    padding:15px;
    margin:15px;
    border-radius:8px;
}

.status {
    color: lime;
    font-weight: bold;
}

#log {
    text-align:left;
    max-height:300px;
    overflow:auto;
    background:#111;
    padding:10px;
}

button {
    background:black;
    color:#00ff00;
    border:1px solid #00ff00;
    padding:10px;
    cursor:pointer;
    margin:5px;
}

button:hover {
    background:#00ff00;
    color:black;
}
</style>
</head>

<body>

<h1>?? SECURITY DASHBOARD PRO</h1>

<div class="box">
    STATUS: <span class="status">ONLINE ?</span>
</div>

<div class="box">
    LAST UPDATE: <span id="time">-</span>
</div>

<div class="box">
    TOTAL LOGS: <span id="count">0</span>
</div>

<div class="box">
    LOG STREAM:
    <pre id="log">Loading...</pre>
</div>

<button onclick="loadLog()">REFRESH</button>
<button onclick="clearView()">CLEAR VIEW</button>

<script>
let lastData = "";

function loadLog() {
    fetch("https://securitytool-6tc6.onrender.com/logs")
    .then(res => res.text())
    .then(data => {

        if(data !== lastData){
            document.getElementById("log").innerText = data;
            lastData = data;
        }

        let lines = data.trim().split("\n");
        document.getElementById("count").innerText = lines.length;

        document.getElementById("time").innerText =
            new Date().toLocaleTimeString();
    })
    .catch(err => {
        document.getElementById("log").innerText = "Error loading logs...";
    });
}

function clearView(){
    document.getElementById("log").innerText = "";
}

// auto refresh
setInterval(loadLog, 2000);
loadLog();
</script>

</body>
</html>
